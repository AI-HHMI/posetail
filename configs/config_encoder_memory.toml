[wandb]
project_name = 'posetail-memory-v1'
path = '/groups/karashchuk/home/karashchukl/results/posetail-memory-v1'
mode = 'online' # 'online', 'offline', 'disabled'

[dataset]
# batch_size=1 REQUIRED for mixed 2D+3D (2D loss assumes B=cams=1). Multi-GPU: --strategy ddp.
batch_size = 1
num_workers = 12
# prefix = '/groups/karashchuk/karashchuklab/animal-datasets-processed/posetail-pretraining-v3'
prefix = '/groups/karashchuk/karashchuklab/animal-datasets-processed/posetail-finetuning-v4'
# datasets_to_exclude = ["johnson-fly"]

[dataset.train]
split_dir = 'train'
# memory: extra observations of the same points sampled from anywhere in the video.
# A range means the count is drawn per sample, so the model tolerates a different
# number of memory entries at inference than it saw in training.
# M=8 must be COMMON, not 1-in-7: the previous [2, 8] meant we evaluated an M=8 curve the
# model had barely trained.
memory_num_context = [2, 16]
# 0.4 -> 0.8, leaving 20% of samples memory-free so the M=0 regime still gets gradient
# (inference also starts every track with only the anchor entry).
# NOTE this is a bigger jump than it looks: native-2D trials used to carry no memory at
# all, so the previous 0.6 applied to only ~10 of 13 train datasets. Now every dataset is
# memory-capable, so 0.8 really is 80% of samples, against an effective ~46% before.
memory_prob = 0.8
# memory-only queries: withhold the position of some points entirely so the model has to
# find them from memory. Fires only on items that carry memory frames. This is the task
# that starts from random init and it was the most starved: at the original
# 0.4 x 0.3 x 0.5 only ~6% of point-predictions carried it, and 0.8 x 0.5 x 0.5 makes it
# ~20%. Held at 0.5 x 0.5 rather than raised further because every sample also needs
# anchored points -- the scene scale and the crop are both derived from the query set.
memory_only_prob = 0.5
memory_only_kpt_prob = 0.5
# How often a point's memory comes from ANOTHER individual's matching keypoint, instead of
# its own history. This is the only thing that trains annotation transfer -- "label one rat,
# box a second, get its keypoints" -- which is cross-INSTANCE, where every memory example so
# far has been cross-TIME on the same animal. Needs a multi-subject trial; single-subject
# datasets ignore it.
memory_cross_subject_prob = 0.25
n_frames = 24
min_res = 256
max_res = 256
cams_to_sample = [1, 8]
kpts_to_sample = [128, 128]
aug_prob = 0.25
enable_kpt_filtering = false
cam_thresh_for_vis = 1
balance_datasets = true
n_samples_per_dataset = -1
crop_to_points = true
speed_thresh = 3.0
query_anytime = true
query_edge_bias = 200.0
occlusion_dropout_prob = 0.5
prop_dynamic_kpts_to_sample = 0.95
prob_2d_only = 0.25
crop_3d_enabled = true
crop_3d_fraction = [0.05, 0.75]
crop_3d_prob = 0.4

# [dataset.train.dataset_weights]
# kubric-multiview = 3.0

[dataset.train.curriculum]
enabled = false
ramp_start_frac = 0.0
ramp_end_frac   = 0.4
intensity_floor = 0.0

[dataset.val]
split_dir = 'val'
# Memory always on for val, with a FIXED count (not a range like train): a val number that
# also jittered with M would not be comparable pass to pass. memory_only stays off, which now
# keeps val directly comparable to r16up6ey's val curve rather than to a pre-memory baseline.
memory_num_context = 8
memory_prob = 1.0
n_frames = 24
max_res = 256
cams_to_sample = 5
kpts_to_sample = 128
aug_prob = 0.0
crop_to_points = true
speed_thresh = 1.0
prop_dynamic_kpts_to_sample = 0.7
query_anytime = false

[dataset.test]
split_dir = 'test'
max_res = 256
n_frames = 16
project_2d = false
aug_prob = 0.0

[devices]
device = 'cuda'


[model]
mode_3d = "encoder"

video_encoder_version = 'large'
# Backbone UNFROZEN, last 12 blocks only. The freeze was an attribution choice -- "a memory
# architecture that works should converge without the backbone adapting to it" -- and that
# premise has now been tested across three runs. It converges, but only so far: measured on
# r16up6ey the decoder's memory read is still barely content-selective (attention entropy
# 0.6428 real vs 0.6394 with each point handed another point's bank at M=2, 0.6796 vs 0.6782
# at M=8 -- a SMALLER gap than d90p0599's 0.627/0.615). Information reaches the decoder
# through the entry VALUES, never through which entry is selected. Co-adapting the encoder is
# the cheap version of "train from scratch with memory": it lets the tokens the read consumes
# move toward being readable, at one run instead of a full pretrain.
video_encoder_requires_grad = true
video_encoder_hierarchical = true

# Last 12 of 24 blocks (plus the final norm, if the variant has one -- VJEPA 2.1 does not).
# Half the backbone keeps the early, generic features fixed so the memory path cannot be
# credited for a wholesale representation change, and bounds the extra activation cost of
# backward over 24 frames x 8 cameras, which is what pays for memory_num_context up to 16.
video_encoder_finetune_last_n_layers = 12

soft_argmax_temperature_learnable = true

# Per-point appearance memory: M context frames sampled from the clip are encoded into
# one vector per point, which the decoder cross-attends to (identity / appearance history).
memory_attention = true
# Remembered frames are encoded by the VJEPA backbone itself (as real 2-frame tubelets), not
# by a private ViT. The old 5M-param MemoryViT started from random init, lived in its own
# feature space, and cost +13 GiB at M=8; measured on d90p0599 the decoder's memory read was
# nearly independent of bank CONTENT (entropy 0.627 real vs 0.615 with each point handed
# another point's bank), which is what the shared, pretrained descriptor is meant to fix.
# how many cross-attention blocks read the frame tokens into each point's entry. One layer
# had to pull "which part of this animal is this point" out of the grid in a single shot.
memory_read_depth = 3
# seeds in MemoryQueryEncoder. Measured with a bank of known rank, K makes no difference to
# the token's effective rank (a single seed's attention already varies per point), so 1.
memory_pool_seeds = 1
# Gradient through the memory frames' scene encode. Now LIVE, since the encoder is trainable
# again -- kept off so the backbone is shaped by the clip path only, and the M<=16 memory
# frames stay a no-grad encode. Turning it on would put backward over up to 16 extra frames
# per camera on top of the clip's 24, which is the single largest cost available here.
memory_encoder_grad = false

# Keep SPATIAL structure in the entry instead of summarizing it away. SAM 2 registers what
# it decided onto its memory feature map (it fuses the predicted mask); we cannot, because
# one encoded frame is shared across all N points, so a per-point token grid would be ~10 GB.
# Both of these attach the same signal at O(N * grid) instead of O(N * grid * dim), and are
# separately ablatable.
#   token_sample: the backbone token AT the point's pixel, as a 7th gated query term.
#   spatial_bias: a learned Gaussian over the token grid, added to the read's attention
#                 logits, so the read starts at the right patch instead of searching for it.
memory_token_sample = true
memory_spatial_bias = true

# Anchor a memory-only point's query ray on where it last was, crop-relative, instead of the
# position-free image centre. Each memory crop follows its subject, so a crop-relative
# coordinate is SUBJECT-relative -- comparable to the clip's own crop, and the invariance that
# lets an annotation transfer between animals. One memory FRAME per point, shared across
# cameras: per-camera selection would mix instants, and the back-projected rays would not
# intersect, so triangulation and camera self-attention would both see inconsistent geometry.
memory_crop_anchor = true

# processing
stride_length = 24
stride_overlap = 4
unroll_windows = false
image_size = 256
query_patch_size = 9
per_camera_cube_scale = true

# query encoder
max_freq = 10
embedding_dim = 256
use_volume_embedding = false
corr_radius = 2
principal_point_embedding = true
intrinsic_embedding = true
metric_ray_translation = true
occlusion_embedding = true

# decoder
latent_dim = 512
n_heads = 8
n_time_space_blocks = 6
embedding_factor = 4
use_camera_self_attention = true
use_temporal_self_attention = true
f_eff_scale = true
# Projecting encoder features to the decoder dim trains notably better than false.
scene_encoder_proj = true

cross_attn_dim = 512

scene_proj_dim = 512
scene_proj_prenorm = false
scene_proj_mlp = false


# 'ropepos' = temporal RoPE in the decoder cross-attention + a learned spatial-only scene
# pos_embed (restores absolute spatial position that the RoPE video backbone lacks).
scene_pos_embed_mode = 'ropepos'
rope_base = 100.0
# 'fourier_rel' = Fourier encodings of absolute query, absolute target, and the relative
# (target-query) gap as a dedicated fusion term (length-agnostic, gap-consistent).
time_embed_mode = 'fourier_rel'


# "gridresid" = per-axis soft-argmax bin grid (CE-supervised): 3D head emits a motion residual
# from a query anchor, depth is a log grid, plus a 2D pixel-bin position head.
#

# without subpixel
output_mode = "gridresid"
head_3d_grid_size = 1024
head_3d_grid_radius = 1.8
log_3d_output = true
log_3d_eps = 0.1
soft_argmax_threshold = 60
grid_decode_space = "warped"
enable_subpixel_refinement = false

# gridresid with subpixel refinement
# output_mode = "gridresid"
# head_3d_grid_size = 512
# head_3d_grid_radius = 1.8
# log_3d_output = true
# log_3d_eps = 0.1
# enable_subpixel_refinement = true
# subpixel_scale = 0.6


# Depth log-grid range = log(depth/(cube*f_eff)); covers every dataset's reach with margin.
depth_log_min = -2.5
depth_log_max = 2.5


[training]
seed = 0

finetune = true

# Warm start from r16up6ey -- the first memory checkpoint this run continues rather than
# replaces. Every memory module is present and trained, so nothing loads fresh and nothing is
# zero-init: this run changes exactly one thing against r16up6ey, the trainable backbone. That
# makes it the clean test of whether co-adaptation is what the memory read has been missing,
# and it keeps the within-run M-curve comparable to r16up6ey's rather than restarting it.
checkpoint_path = '/groups/karashchuk/home/karashchukl/results/posetail-memory-v1/wandb/run-20260727_113901-r16up6ey/files/checkpoints/checkpoint_00163840.pth'



n_iterations = 8000000
scheduler_type = 'muon'
max_grad_norm = 10.0
checkpoint_freq = 10240 # in iterations
eval_metric_freq = 24 # in iterations
val_freq = 48 # in iterations
print_freq = 96 # in iterations
debug_ix = -1 # only works for val

[training.optimizer]
# Continuing a trained memory model, not starting one, so the base LR stays at the finetune
# value rather than the 5e-4 used when the decoder trained from scratch (6i8ryveg).
learning_rate = 1e-4
muon_schedulefree = true
weight_decay = 0.002
warmup_steps = 2000
muon_warmup_steps = 2000
beta1 = 0.9
beta2 = 0.95

# Live again now that the last 12 blocks train: 2.5e-5 on the backbone against 1e-4 elsewhere.
# The backbone here is already well-trained and the memory modules are the ones that need to
# move, so the encoder gets the smaller step.
encoder_lr_scale = 0.25

[training.scheduler]

[training.losses]
gamma = 0.8
pixel_thresh = 3
delta = 6
use_huber_loss = true

# weights for calculating total loss (use 0 to not compute a specific loss)
vis_loss_weight = 5.0
vis_loss_3d_weight = 1.0
conf_loss_weight = 0.0
conf_2d_loss_weight = 0.0

occluded_coords_loss_weight = 0.1
feature_loss_weight = 0.0

# Reweight
coords_loss_weight = 0.1
coords_loss_direct_weight = 0.1
coords_loss_rays_weight = 0.0
coords_loss_triangulate_weight = 0.0
coords_loss_2d_weight = 1.5
coords_loss_depth_weight = 0.5

# reproj weights
coords_loss_direct_reproj_weight = 1.0
coords_loss_rays_reproj_weight = 0.05
coords_loss_triangulate_reproj_weight = 1.0

# Position-bin CE raised back to a meaningful auxiliary. depth highest: the one CE term that
# actually descends.
coords_softmax_2d_weight = 0.6
coords_softmax_3d_weight = 0.4
depth_softmax_weight = 1.5

# Rescale of the multi-cam 3D loss branch; lowered 500->150 to revive direct 3D regression
# there. If 2d_loss/mte degrade early the branch is too hot, raise back up.
coords_3d_loss_scale = 50.0

smoothness_loss_3d_weight = 0.5
smoothness_loss_2d_weight = 0.5
smoothness_loss_order = 4
smoothness_loss_tolerance = 1.5
